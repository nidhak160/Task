<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Activity Tracker</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-sm-12 container-box">

        <h2 class="mb-4 text-center">Daily Activity Tracker</h2>

        <input type="text" id="activityName" class="form-control mb-3" placeholder="Activity Name">

        <input type="number"  id="activityTime" class="form-control mb-3" placeholder="Time (in minutes)">

       <div class="text-center">
            <button class="btn btn-primary btn-sm mb-2" onclick="addActivity()">Add Activity</button>
            <button class="btn btn-warning btn-sm mb-2" onclick="showLongActivities()">Show Long Activities</button>
      </div>


        <ul id="activityList" class="list-group mb-3"></ul>

        <p class="info text-center">Total Activities:
          <span id="count">0</span>
        </p>

      </div>
    </div>
  </div>

  <script src="scrpt.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
